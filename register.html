
<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/api.js"></script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register - Apex AutoCare
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >


</head>


<body>


    <!-- ========================================
         NAVBAR
    ========================================= -->

    <header>

        <nav class="navbar">

            <div class="container">

                <a
                    href="index.html"
                    class="logo"
                >
                    Apex AutoCare
                </a>


                <div class="nav-links">

                    <a href="index.html">
                        Home
                    </a>

                    <a href="services.html">
                        Services
                    </a>

                    <a href="about.html">
                        About
                    </a>

                    <a href="contact.html">
                        Contact
                    </a>

                    <a href="login.html">
                        Login
                    </a>

                    <a
                        href="register.html"
                        class="btn active"
                    >
                        Register
                    </a>

                </div>

            </div>

        </nav>

    </header>



    <!-- ========================================
         REGISTRATION SECTION
    ========================================= -->

    <main>

        <section class="auth-section">

            <div class="auth-container">


                <div class="auth-header">

                    <h1>
                        Create Account
                    </h1>

                    <p>
                        Register with Apex AutoCare
                    </p>

                </div>



                <!-- ====================================
                     REGISTRATION FORM
                ===================================== -->

                <form id="registerForm">


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>



                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>



                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                            required
                        >

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                    </div>



                    <!-- REGISTER BUTTON -->

                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Create Account
                    </button>


                </form>



                <!-- ====================================
                     LOGIN LINK
                ===================================== -->

                <p class="auth-link">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


            </div>

        </section>

    </main>



    <!-- ========================================
         FOOTER
    ========================================= -->

    <footer>

        <div class="container">

            <p>
                &copy; 2026 Apex AutoCare. All Rights Reserved.
                All Rights Reserved.
            </p>

        </div>

    </footer>



    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="js/script.js"></script>

    <script src="js/register.js"></script>

</body>

</html>
